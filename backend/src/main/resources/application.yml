spring:
  application:
    name: cajalima

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${BACKEND_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    # Milliseconds; the login response's expiresIn is expressed in seconds.
    expiration: ${JWT_EXPIRATION:3600000}
